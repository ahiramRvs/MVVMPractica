plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.simplemvvm'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.example.simplemvvm"
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Binding amb les views del layout XML
    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Fragments (inclou el delegat "by viewModels()")
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    // ViewModel i LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    // Navigation (navigation.xml + NavHostFragment)
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
}
